media:
  - name: brand
    label: Логотип Auskraft
    input: assets/brand
    output: assets/brand
    extensions: [png]

content:
  - name: payment
    label: Поддержка по карте
    type: file
    path: payment-settings.json
    format: json
    operations:
      delete: false
    fields:
      - name: brandLogo
        label: Auskraft
        type: image
        readonly: true
        options:
          media: brand
      - name: activeProvider
        label: Куда ведёт кнопка поддержки
        type: select
        required: true
        description: Ссылки публикуются на сайте. Вставляйте только многоразовые ссылки для посетителей. Пароли, секретные ключи и ссылки на личные счета клиентов сюда вводить нельзя.
        options:
          values:
            - name: cloudtips
              label: CloudTips (Тинькофф)
            - name: ozon
              label: Ozon Банк
            - name: robokassa
              label: Robokassa
            - name: yookassa
              label: ЮKassa (Сбер)
      - name: cloudtips
        label: Ссылка CloudTips
        type: string
        description: Публичная ссылка на вашу страницу поддержки.
        pattern:
          regex: '^(?:https://pay\.cloudtips\.ru/[^/?#\s\\][^\s\\]*)?$'
          message: Вставьте полную ссылку на страницу поддержки с домена pay.cloudtips.ru.
      - name: ozon
        label: Ссылка Ozon Банка
        type: string
        description: Публичная ссылка СБП на форму добровольной поддержки.
        pattern:
          regex: '^(?:https://finance\.ozon\.ru/apps/sbp/ozonbankpay/[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12})?$'
          message: Вставьте ссылку Ozon Банка в формате https://finance.ozon.ru/apps/sbp/ozonbankpay/…
      - name: robokassa
        label: Ссылка Robokassa
        type: string
        description: Многоразовая ссылка из личного кабинета магазина.
        pattern:
          regex: '^(?:https://(?:auth\.robokassa\.ru|robo\.market)/[^/?#\s\\][^\s\\]*)?$'
          message: Введите платёжную ссылку HTTPS с домена auth.robokassa.ru или robo.market.
      - name: yookassa
        label: Ссылка ЮKassa
        type: string
        description: Ссылка на многоразовый счёт из личного кабинета магазина.
        pattern:
          regex: '^(?:https://(?:yookassa\.ru|yoomoney\.ru)/[^/?#\s\\][^\s\\]*)?$'
          message: Введите платёжную ссылку HTTPS с домена yookassa.ru или yoomoney.ru.
