media:
  - name: brand
    label: Логотип Auskraft
    input: assets/brand
    output: assets/brand
    extensions: [png]

content:
  - name: supportSite
    label: Адрес страницы поддержки
    type: file
    path: support-site.json
    format: json
    operations:
      delete: false
    fields:
      - name: activeSite
        label: Куда открывается страница из мобильных приложений
        type: select
        required: true
        options:
          values:
            - name: sprinthost
              label: auskraft.ru
            - name: github
              label: GitHub Pages

  - name: mobileUpdates
    label: Баннеры обновления приложений
    type: collection
    path: mobile/updates
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: schemaVersion
        label: Версия формата
        type: number
        readonly: true
      - name: appId
        label: Идентификатор приложения
        type: string
        readonly: true
      - name: enabled
        label: Показывать баннер
        description: Включайте после появления новой версии в RuStore.
        type: boolean
      - name: latestVersionCode
        label: Код версии в RuStore
        type: number
        required: true
        options:
          min: 1
          max: 2100000000
      - name: ruStoreUrl
        label: Страница приложения в RuStore
        type: string
        readonly: true

  - name: payment
    label: Поддержка по карте
    type: file
    path: payment-settings.json
    format: json
    operations:
      delete: false
    fields:
      - name: brandLogo
        label: Auskraft
        type: image
        readonly: true
        options:
          media: brand
      - name: activeProvider
        label: Куда ведёт кнопка поддержки
        type: select
        required: true
        description: Ссылки публикуются на сайте. Вставляйте только многоразовые ссылки для посетителей. Пароли, секретные ключи и ссылки на личные счета клиентов сюда вводить нельзя.
        options:
          values:
            - name: cloudtips
              label: CloudTips (Тинькофф)
            - name: ozon
              label: Ozon Банк
            - name: godonate
              label: GoDonate
            - name: yookassa
              label: ЮKassa (Сбер)
      - name: cloudtips
        label: Ссылка CloudTips
        type: string
        description: Публичная ссылка на вашу страницу поддержки.
        pattern:
          regex: '^(?:https://pay\.cloudtips\.ru/[^/?#\s\\][^\s\\]*)?$'
          message: Вставьте полную ссылку на страницу поддержки с домена pay.cloudtips.ru.
      - name: ozon
        label: Ссылка Ozon Банка
        type: string
        description: Публичная ссылка СБП на форму добровольной поддержки.
        pattern:
          regex: '^(?:https://finance\.ozon\.ru/apps/sbp/ozonbankpay/[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12})?$'
          message: Вставьте ссылку Ozon Банка в формате https://finance.ozon.ru/apps/sbp/ozonbankpay/…
      - name: godonate
        label: Ссылка GoDonate
        type: string
        description: Публичная ссылка на профиль для донатов.
        pattern:
          regex: '^(?:https://godonate\.ru/@[A-Za-z0-9_-]+)?$'
          message: Укажите публичную ссылку GoDonate в формате https://godonate.ru/@имя.
      - name: yookassa
        label: Ссылка ЮKassa
        type: string
        description: Ссылка на многоразовый счёт из личного кабинета магазина.
        pattern:
          regex: '^(?:https://(?:yookassa\.ru|yoomoney\.ru)/[^/?#\s\\][^\s\\]*)?$'
          message: Введите платёжную ссылку HTTPS с домена yookassa.ru или yoomoney.ru.
